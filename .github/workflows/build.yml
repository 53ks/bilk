name: Build blik (ARM64)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if lkl-cache artifacts exist
        id: check-cache
        run: |
          if [ -f "lkl-cache/tools/lkl/lib/liblkl.a" ] && [ -d "lkl-cache/tools/lkl/include" ]; then
            echo "cache_ready=true" >> $GITHUB_OUTPUT
            echo "Cache found! Skipping LKL build."
          else
            echo "cache_ready=false" >> $GITHUB_OUTPUT
            echo "Cache not found or incomplete."
          fi

      - name: Install toolchain and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Fallback Build LKL if cache is missing
        if: steps.check-cache.outputs.cache_ready != 'true'
        run: |
          # 万が一lkl-cacheの中身が空・不完全な場合の保険として自動ビルドする処理
          if [ ! -d "lkl-cache" ]; then
            git clone --depth 1 https://github.com/lkl/linux.git lkl-cache
          fi
          cd lkl-cache/tools/lkl
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-

      - name: Build blik for ARM64
        run: |
          make CC=aarch64-linux-gnu-gcc ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LKL_DIR=lkl-cache

      - name: Upload compiled binary
        uses: actions/upload-artifact@v4
        with:
          name: blik-arm64
          path: blik
