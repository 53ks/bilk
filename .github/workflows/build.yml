name: Build blik (ARM64)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install toolchain and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git libelf-dev bison flex libssl-dev bc gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Check and Build LKL in lkl-cache if needed
        run: |
          if [ ! -f "lkl-cache/tools/lkl/lib/liblkl.a" ]; then
            echo "LKL library not found in lkl-cache, building..."
            #もしlkl-cacheにソース自体がない場合の保険として一時クローンして移す
            if [ ! -d "lkl-cache/tools/lkl" ]; then
              git clone --depth 1 https://github.com/lkl/linux.git temp_lkl
              mkdir -p lkl-cache/tools
              rm -rf lkl-cache/tools/lkl
              mv temp_lkl/tools/lkl lkl-cache/tools/lkl
              rm -rf temp_lkl
            fi
            make -C lkl-cache/tools/lkl ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          else
            echo "LKL build cache already exists in lkl-cache, skipping."
          fi

      - name: Build blik for ARM64
        run: |
          make CC=aarch64-linux-gnu-gcc ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LKL_DIR=lkl-cache

      - name: Upload compiled binary
        uses: actions/upload-artifact@v4
        with:
          name: blik-arm64
          path: blik
