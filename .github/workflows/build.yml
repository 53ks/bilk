name: Build blik (ARM64)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install toolchain and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git libelf-dev bison flex libssl-dev bc gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Build LKL and update lkl-cache folder
        run: |
          if [ ! -f "lkl-cache/tools/lkl/lib/lkl.o" ]; then
            echo "Building LKL from scratch..."
            git clone --depth 1 https://github.com/lkl/linux.git temp_lkl
            make -C temp_lkl/tools/lkl ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
            
            rm -rf lkl-cache/*
            mkdir -p lkl-cache/tools
            mv temp_lkl/tools/lkl lkl-cache/tools/lkl
            rm -rf temp_lkl
            echo "LKL built and placed into lkl-cache successfully."
          else
            echo "LKL build cache already exists in lkl-cache, skipping build."
          fi

      - name: Commit and push lkl-cache to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 300
          
          git add lkl-cache/
          if ! git diff-index --quiet HEAD --; then
            git commit -m "chore: update lkl-cache with build artifacts [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes in lkl-cache to commit."
          fi

      - name: Build blik for ARM64
        run: |
          make CC=aarch64-linux-gnu-gcc ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LKL_DIR=lkl-cache

      - name: Upload compiled binary
        uses: actions/upload-artifact@v4
        with:
          name: blik-arm64
          path: blik
