name: Build blik (ARM64)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check if lkl-cache exists and has content
        id: check-cache
        run: |
          if [ -d "lkl-cache/tools/lkl" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Clone LKL into lkl-cache if not present
        if: steps.check-cache.outputs.exists != 'true'
        run: |
          git clone --depth 1 https://github.com/lkl/linux.git lkl-cache

      - name: Install toolchain and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git libelf-dev bison flex libssl-dev bc gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Build blik for ARM64
        run: |
          make CC=aarch64-linux-gnu-gcc ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LKL_DIR=lkl-cache

      - name: Upload compiled binary
        uses: actions/upload-artifact@v4
        with:
          name: blik-arm64
          path: blik
