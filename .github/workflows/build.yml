name: Build blik (ARM64)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install toolchain and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git libelf-dev bison flex libssl-dev bc gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Clone and Build LKL in lkl-cache
        run: |
          if [ ! -f "lkl-cache/tools/lkl/lib/lkl.o" ]; then
            echo "Cloning and building LKL in lkl-cache..."
            rm -rf lkl-cache/*
            git clone --depth 1 https://github.com/lkl/linux.git lkl-cache
            make -C lkl-cache/tools/lkl ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          else
            echo "LKL build cache already exists, skipping."
          fi

      - name: Build blik for ARM64
        run: |
          make CC=aarch64-linux-gnu-gcc ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LKL_DIR=lkl-cache

      - name: Upload compiled binary
        uses: actions/upload-artifact@v4
        with:
          name: blik-arm64
          path: blik
