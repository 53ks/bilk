name: Build blik

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if lkl-cache exists
        id: check-lkl-cache
        run: |
          if [ -d "lkl-cache/tools/lkl" ]; then
            echo "cache_exists=true" >> $GITHUB_OUTPUT
          else
            echo "cache_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Clone LKL if cache not exists
        if: steps.check-lkl-cache.outputs.cache_exists != 'true'
        run: |
          git clone --depth 1 https://github.com/lkl/linux.git lkl-cache

      - name: Install dependencies and toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git libelf-dev bison flex libssl-dev bc gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Build LKL for arm64
        if: steps.check-lkl-cache.outputs.cache_exists != 'true'
        run: |
          cd lkl-cache/tools/lkl
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-

      - name: Build blik binary for arm64
        run: |
          make CC=aarch64-linux-gnu-gcc ARCH=arm64 LKL_DIR=lkl-cache

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blik-binary-arm64
          path: blik
